<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalaam E Raza — Catalog</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --card: #232341;
    --accent: #d4a853;
    --accent2: #c9922e;
    --text: #e4e4f0;
    --muted: #8888aa;
    --border: #2a2a44;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
    padding: 20px 0;
  }
  .sidebar h1 {
    font-size: 20px;
    color: var(--accent);
    padding: 0 20px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  .sidebar h1 small {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    font-weight: normal;
    letter-spacing: 0;
  }
  .cat-item {
    display: block;
    width: 100%;
    padding: 10px 20px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    border-left: 3px solid transparent;
  }
  .cat-item:hover { background: rgba(212,168,83,0.08); color: var(--accent); }
  .cat-item.active {
    background: rgba(212,168,83,0.12);
    color: var(--accent);
    border-left-color: var(--accent);
  }
  .cat-item .count {
    float: right;
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }

  /* ── Main Content ── */
  .main {
    flex: 1;
    padding: 32px 40px;
    overflow-y: auto;
    max-height: 100vh;
  }

  /* Search */
  .search-bar {
    margin-bottom: 28px;
  }
  .search-bar input {
    width: 100%;
    max-width: 400px;
    padding: 12px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
    font-family: inherit;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }

  /* Header */
  .page-header {
    margin-bottom: 24px;
  }
  .page-header h2 {
    font-size: 26px;
    color: var(--accent);
    font-weight: normal;
  }
  .page-header p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
  }

  /* Grid */
  .poem-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .poem-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .poem-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .poem-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .poem-card .meta {
    font-size: 12px;
    color: var(--muted);
  }

  /* Reading View */
  .reading-view {
    max-width: 740px;
    margin: 0 auto;
  }
  .reading-view .back-btn {
    display: inline-block;
    margin-bottom: 24px;
    color: var(--accent);
    cursor: pointer;
    font-size: 14px;
    background: none;
    border: none;
    font-family: inherit;
  }
  .reading-view .back-btn:hover { text-decoration: underline; }
  .reading-view .poem-title {
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .reading-view .poem-cats {
    margin-bottom: 28px;
    font-size: 13px;
    color: var(--muted);
  }
  .reading-view .poem-cats span {
    display: inline-block;
    background: rgba(212,168,83,0.12);
    color: var(--accent);
    padding: 2px 10px;
    border-radius: 4px;
    margin-right: 6px;
    font-size: 12px;
  }
  .reading-view .lyrics {
    font-size: 18px;
    line-height: 2.2;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: 'Noto Nastaliq Urdu', 'Arial', sans-serif;
    direction: rtl;
    text-align: right;
    color: #f0eed8;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 36px;
  }
  .reading-view .lyrics.ltr {
    direction: ltr;
    text-align: left;
    font-family: 'Georgia', serif;
  }
  .reading-view .line-num {
    color: var(--muted);
    font-size: 11px;
    display: block;
    font-family: monospace;
    direction: ltr;
    text-align: left;
    margin-top: 2px;
  }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 80px 20px;
  }
  .welcome h2 {
    font-size: 32px;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .welcome p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    max-width: 500px;
    margin: 0 auto;
  }
  .welcome .counts {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 32px;
  }
  .welcome .counts div {
    background: var(--card);
    padding: 12px 24px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .welcome .counts strong {
    display: block;
    font-size: 24px;
    color: var(--accent);
  }
  .welcome .counts span {
    font-size: 12px;
    color: var(--muted);
  }

  /* Empty */
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px;
    font-size: 15px;
  }

  /* Scrollbar */
  .sidebar::-webkit-scrollbar, .main::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Mobile */
  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar {
      width: 100%;
      min-width: auto;
      height: auto;
      position: static;
      padding: 12px 0;
      max-height: 200px;
    }
    .sidebar h1 { font-size: 17px; padding: 0 14px 10px; }
    .cat-item { padding: 7px 14px; font-size: 14px; }
    .main { padding: 20px; }
    .poem-grid { grid-template-columns: 1fr; }
    .reading-view .lyrics { font-size: 16px; padding: 20px; }
  }
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <h1>
    📖 Kalaam E Raza
    <small>Raza Hussaini Razaa — کلامِ رضا</small>
  </h1>
  <div id="cat-list"></div>
</nav>

<!-- Main Content -->
<main class="main" id="main"></main>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/menofreact/kalaam-e-raza-lyrics/main/kalaam-e-raza.json';

let posts = [];
let categories = [];
let catCounts = {};

// ── Load data ──
(async function init() {
  try {
    const res = await fetch(DATA_URL);
    const data = await res.json();
    posts = data.posts || [];
    categories = data.categories || [];
    
    // Count poems per category
    catCounts = {};
    posts.forEach(p => (p.categories || []).forEach(c => { catCounts[c] = (catCounts[c] || 0) + 1; }));
    
    renderCategories();
    showWelcome();
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="empty">⚠️ Error loading data: ${e.message}</div>`;
  }
})();

// ── Render sidebar categories ──
function renderCategories(activeCat) {
  const el = document.getElementById('cat-list');
  // "All" option
  const allBtn = document.createElement('button');
  allBtn.className = 'cat-item' + (!activeCat ? ' active' : '');
  allBtn.textContent = `📂 All Poems (${posts.length})`;
  allBtn.onclick = () => { setActive(null); showAll(); };
  el.appendChild(allBtn);
  
  categories.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-item' + (activeCat === c ? ' active' : '');
    btn.textContent = c;
    const count = catCounts[c] || 0;
    const countEl = document.createElement('span');
    countEl.className = 'count';
    countEl.textContent = count;
    btn.appendChild(countEl);
    btn.onclick = () => { setActive(c); showCategory(c); };
    el.appendChild(btn);
  });
}

function setActive(cat) {
  document.querySelectorAll('.cat-item').forEach((el, i) => {
    el.classList.toggle('active', (cat === null && i === 0) || el.textContent.trim().startsWith(cat));
  });
}

// ── Welcome Screen ──
function showWelcome() {
  document.getElementById('main').innerHTML = `
    <div class="welcome">
      <h2>✨ Kalaam E Raza</h2>
      <p>Complete collection of poetry by <strong>Raza Hussaini Razaa</strong>. Browse the catalog, search, or read.</p>
      <div class="counts">
        <div><strong>${posts.length}</strong><span>Poems</span></div>
        <div><strong>${categories.length}</strong><span>Categories</span></div>
        <div><strong>${posts.reduce((s,p) => s + (p.line_count || p.lyrics?.length || 0), 0)}</strong><span>Verses</span></div>
      </div>
    </div>
  `;
}

// ── Show All Poems ──
function showAll() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-header">
      <h2>📂 All Poems</h2>
      <p>${posts.length} poems · click to read</p>
    </div>
    <div class="search-bar"><input type="text" id="search-input" placeholder="Search poems..." oninput="filterPoems(this.value)"></div>
    <div class="poem-grid" id="poem-grid"></div>
  `;
  renderPoems(posts);
}

// ── Show Category ──
function showCategory(cat) {
  const filtered = posts.filter(p => p.categories && p.categories.includes(cat));
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-header">
      <h2>📁 ${cat}</h2>
      <p>${filtered.length} poems · click to read</p>
    </div>
    <div class="search-bar"><input type="text" id="search-input" placeholder="Search in ${cat}..." oninput="filterPoems(this.value)"></div>
    <div class="poem-grid" id="poem-grid"></div>
  `;
  renderPoems(filtered);
}

// ── Render Poem Grid ──
function renderPoems(list) {
  const grid = document.getElementById('poem-grid');
  if (!grid) return;
  if (!list.length) { grid.innerHTML = '<div class="empty">No poems found</div>'; return; }
  grid.innerHTML = list.map(p => `
    <div class="poem-card" onclick="showPoem('${p.slug}')">
      <h3>${p.title}</h3>
      <div class="meta">${(p.categories || []).slice(0, 2).join(' · ')} · ${p.line_count || p.lyrics?.length || 0} lines</div>
    </div>
  `).join('');
  window.__poems = list;
}

// ── Search ──
function filterPoems(q) {
  const list = window.__poems || posts;
  if (!q) { renderPoems(list); return; }
  const ql = q.toLowerCase();
  const filtered = list.filter(p => p.title.toLowerCase().includes(ql));
  renderPoems(filtered);
}

// ── Show Single Poem (Reading View) ──
function showPoem(slug) {
  const p = posts.find(x => x.slug === slug);
  if (!p) return;
  
  // Determine if lyrics have Latin/English chars
  const lyrics = p.lyrics || [];
  const fullText = lyrics.join('\n');
  const hasLatin = /[a-zA-Z0-9]/.test(fullText);
  
  document.getElementById('main').innerHTML = `
    <div class="reading-view">
      <button class="back-btn" onclick="history.back()">← Back to catalog</button>
      <div class="poem-title">${p.title}</div>
      <div class="poem-cats">${(p.categories || []).map(c => `<span>${c}</span>`).join('')}</div>
      <div class="lyrics ${hasLatin ? 'ltr' : ''}">
        ${lyrics.map((l, i) => `<div>${l || '&nbsp;'}</div>`).join('\n')}
      </div>
      <div style="text-align:center;margin-top:24px;color:var(--muted);font-size:13px">
        ${p.line_count || lyrics.length} verses · <a href="${p.url}" target="_blank" style="color:var(--accent)">View original →</a>
      </div>
    </div>
  `;
  window.scrollTo(0, 0);
}

// ── Browser back support ──
window.addEventListener('popstate', () => {
  if (!document.querySelector('.reading-view')) showWelcome();
});
</script>
</body>
</html>
